name: Build .hs APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Apply .hs icon, splash screen and name
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp resources/android/mipmap-$d/ic_launcher.png $RES/mipmap-$d/ic_launcher.png
            cp resources/android/mipmap-$d/ic_launcher_round.png $RES/mipmap-$d/ic_launcher_round.png
          done
          find $RES -name "splash.png" -exec cp resources/splash.png {} \;
          sed -i 's#<string name="app_name">.*</string>#<string name="app_name">.hs</string>#' $RES/values/strings.xml
          sed -i 's#<string name="title_activity_main">.*</string>#<string name="title_activity_main">.hs</string>#' $RES/values/strings.xml
          sed -i 's/#3F51B5/#080c18/g; s/#303F9F/#080c18/g' $RES/values/colors.xml || true
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: Copy app files into Android project
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hs-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

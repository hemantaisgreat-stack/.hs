<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>.hs</title>
<style>
:root{--bg:#080c18;--cd:#111a30;--cd2:#18233f;--cy:#00e5ff;--pu:#a855f7;--tx:#eaf0ff;--mu:#8b97b8;--bd:#25335a;--ok:#34d399;--bad:#ff6b8b;--gr:linear-gradient(90deg,#00e5ff,#a855f7)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.45 system-ui,-apple-system,Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px 14px 110px}
h1{font-size:34px;margin:0;font-weight:800;background:var(--gr);-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
h2{font-size:24px;margin:6px 0 12px}h3{font-size:18px;margin:0 0 10px}
.mu{color:var(--mu);font-size:15px}.ok{color:var(--ok)}.bad{color:var(--bad)}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:14px}
.row,.rw{display:flex;align-items:center;gap:10px}.rw{padding:9px 0;border-top:1px solid var(--bd)}.sp{flex:1;min-width:0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.st{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px}
.big{font-size:52px;font-weight:800;line-height:1;color:var(--cy)}.big2{font-size:34px;font-weight:800;color:var(--pu)}
.bar{height:12px;background:var(--cd2);border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;border-radius:8px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--cd2);border:1px solid var(--bd);border-radius:10px;padding:11px;min-width:0}
input[type=checkbox]{width:26px;height:26px;accent-color:#00e5ff;flex:none;padding:0}
textarea{width:100%;min-height:130px}
form{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}form input[type=text],form input[type=number]{flex:1;min-width:110px}
.b{background:var(--gr);color:#080c18;border:0;border-radius:10px;padding:12px 16px;font:700 16px inherit;font-family:inherit;cursor:pointer}
.b.alt{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.x{background:none;border:0;color:var(--mu);font-size:18px;padding:6px 10px}
.tg{background:rgba(255,107,139,.15);color:var(--bad);border-radius:8px;padding:2px 8px;font-size:13px}
.ch{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}.ch button{flex:none;padding:9px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font:600 15px inherit;font-family:inherit}
.ch button.on{background:var(--gr);color:#080c18;border:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0c1326;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:10px 0 9px;font:600 13px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}nav button.on{color:var(--cy)}
.tm{font-size:54px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0 10px;color:var(--cy)}
.wk{display:flex;gap:8px;align-items:flex-end;height:150px;margin-top:8px}
.wk div{flex:1;text-align:center;font-size:13px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.wk i{display:block;background:var(--gr);border-radius:6px 6px 0 0;min-height:3px;margin:3px 0}.wk small{font-size:11px}
</style></head>
<body><div id="app"></div>
<script src="syllabus.js"></script>
<script>
/* ---------- Basic helpers ---------- */
const K='hs-data-v1';
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,8);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ds=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>ds(new Date());
const dayN=d=>Math.round(new Date(d+'T00:00').getTime()/864e5);
const left=d=>d?dayN(d)-dayN(today()):0;
const fm=m=>m>=60?Math.floor(m/60)+'h '+(m%60)+'m':m+'m';
const fh=h=>fm(Math.round(h*60));
const bar=(p,c)=>`<div class="bar"><i style="width:${p}%;background:${c||'var(--gr)'}"></i></div>`;

/* ---------- Data (saved on the phone) ---------- */
let S,tab='dash',ov=null,step=0,tick=null,rstArm=false;
const def=()=>({name:'',exam:'',done:{},rev:{},acc:[],ses:[],notes:{},tests:[],goal:120,rm:{on:false,h:19,m:0},timer:null,setup:false,sample:false,f:'A'});
function load(){try{S=Object.assign(def(),JSON.parse(localStorage.getItem(K)))}catch(e){S=def()}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}

const SUB=Object.fromEntries(SYL.map(s=>[s.k,s]));
const ALL=SYL.flatMap(s=>s.ch.map((c,i)=>({id:s.k+(i+1),k:s.k,n:c[0],h:c[1]})));
const CH=Object.fromEntries(ALL.map(c=>[c.id,c]));
const isDone=id=>!!S.done[id],dOf=k=>ALL.filter(c=>c.k===k);
const pct=a=>a.length?Math.round(a.filter(c=>isDone(c.id)).length/a.length*100):0;
const minOn=d=>S.ses.filter(x=>x.d===d).reduce((a,x)=>a+x.m,0);
function accOf(f){let a=0,o=0;S.acc.forEach(r=>{if(f(r)){a+=r.a;o+=r.o}});return a?{a,o,p:Math.round(o/a*100)}:null}
const accCh=id=>accOf(r=>r.c===id),accSub=k=>accOf(r=>r.c[0]===k);
const weakList=()=>ALL.map(c=>({c,x:accCh(c.id)})).filter(r=>r.x&&r.x.a>=5&&r.x.p<60).map(r=>({c:r.c,p:r.x.p})).sort((a,b)=>a.p-b.p);
const dueList=()=>ALL.filter(c=>isDone(c.id)&&left(S.rev[c.id]>S.done[c.id]?S.rev[c.id]:S.done[c.id])<=-7);
function streak(){let n=0,d=new Date();if(!minOn(ds(d)))d.setDate(d.getDate()-1);while(minOn(ds(d))>0){n++;d.setDate(d.getDate()-1)}return n}

/* Daily time calculator: remaining hours + 15% buffer, spread over the days left.
   If more than 21 days remain, the last 7 days are kept free for revision. */
function plan(){const dl=left(S.exam),rem=ALL.filter(c=>!isDone(c.id)),h=rem.reduce((a,c)=>a+c.h,0),rs=dl>21?7:0;
  return{dl,rem:rem.length,h,rs,need:dl>0?h*1.15/Math.max(1,dl-rs):0}}

/* ---------- Screens ---------- */
function setup(){
  if(step===0)return`<h1>.hs</h1><p class="mu">Your offline study tracker for Class 11 PCM.</p><div class="c"><h2>What is your name?</h2><form data-f="s0"><input type="text" name="n" value="${esc(S.name)}" placeholder="Your name" required><button class="b">Next</button></form></div>`;
  if(step===1)return`<h1>.hs</h1><div class="c"><h2>When is your exam?</h2><form data-f="s1"><input type="date" name="d" value="${S.exam}" min="${today()}" required><button class="b">Next</button></form></div>`;
  return`<h1>.hs</h1><h2>Tick the chapters you have finished</h2><p class="mu">Chapters you leave unticked count as remaining. You can change this any time.</p>`+
    SYL.map(s=>`<div class="c"><b style="color:${s.c}">${s.n}</b>${dOf(s.k).map(c=>`<label class="rw"><input type="checkbox" data-a="tog" data-id="${c.id}" ${isDone(c.id)?'checked':''}><span class="sp">${esc(c.n)}</span></label>`).join('')}</div>`).join('')+
    `<button class="b" style="width:100%" data-a="fin">Finish setup</button>`}

function dash(){
  const p=plan(),dn=ALL.filter(c=>isDone(c.id)).length,tm=minOn(today()),w=weakList(),du=dueList();
  let fc=w.slice(0,2).map(x=>x.c);
  SYL.forEach(s=>{const n=dOf(s.k).find(c=>!isDone(c.id));if(n&&!fc.includes(n))fc.push(n)});fc=fc.slice(0,4);
  const pl=p.dl<=0?'<p class="mu">Your exam date has passed. Update it in Stats, Settings.</p>':!p.rem?'<b class="ok">Syllabus complete! Use the time to revise.</b>':
    `<div class="big2">${fh(p.need)}</div><div class="mu">per day to finish ${p.rem} remaining chapters (about ${Math.round(p.h)} study hours)${p.rs?', keeping the last '+p.rs+' days free for revision':''}.</div>`;
  return`<h1>.hs</h1><div class="mu" style="margin-bottom:12px">Hi ${esc(S.name)}, let us make today count.</div>
  <div class="g"><div class="st"><div class="big">${Math.max(0,p.dl)}</div><div class="mu">days left for exam</div></div><div class="st"><div class="big" style="color:var(--pu)">${Math.round(dn/ALL.length*100)}%</div><div class="mu">syllabus completed</div></div></div>
  <div class="c"><h3>Subject progress</h3>${SYL.map(s=>{const a=dOf(s.k),n=a.filter(c=>isDone(c.id)).length;return`<div class="row"><b style="color:${s.c}" class="sp">${s.n}</b><span class="mu">${n}/${a.length} chapters, ${pct(a)}%</span></div>${bar(pct(a),s.c)}`}).join('')}</div>
  <div class="c"><h3>Daily time needed</h3>${pl}</div>
  <div class="c"><h3>Today</h3>${bar(Math.min(100,Math.round(tm/S.goal*100)))}<div class="row"><b class="sp">${fm(tm)} of ${fm(S.goal)}</b><b class="${tm>=S.goal?'ok':'mu'}">${tm>=S.goal?'Goal done ✓':tm>0?'Studied today ✓':'Not studied yet'}</b></div><div class="mu">Streak: <b style="color:var(--cy)">${streak()}</b> day${streak()===1?'':'s'} in a row</div></div>
  <div class="c"><h3>Today's focus</h3>${fc.map(c=>`<div class="rw" data-a="open" data-id="${c.id}"><span class="sp">${esc(c.n)}<br><span class="mu" style="color:${SUB[c.k].c}">${SUB[c.k].n}${w.some(x=>x.c===c)?', weak chapter':', next up'}</span></span></div>`).join('')||'<p class="mu">Everything is done. Great work!</p>'}</div>
  ${du.length?`<div class="c"><h3>Time to revise</h3>${du.slice(0,6).map(c=>`<div class="rw"><span class="sp">${esc(c.n)}<br><span class="mu">${SUB[c.k].n}</span></span><button class="b alt" data-a="revd" data-id="${c.id}">Revised</button></div>`).join('')}</div>`:''}
  <div class="c"><h3>Sample data</h3><p class="mu">${S.sample?'Sample data is ON. Your own data is safely stored.':'Fill the app with fake data for screenshots. Your own data is kept safe.'}</p><button class="b alt" data-a="${S.sample?'unsample':'sample'}">${S.sample?'Switch back to my data':'Load sample data'}</button></div>`}

const row=c=>{const a=accCh(c.id),w=a&&a.a>=5&&a.p<60;return`<div class="rw"><input type="checkbox" data-a="tog" data-id="${c.id}" ${isDone(c.id)?'checked':''}><div class="sp" data-a="open" data-id="${c.id}"><div>${esc(c.n)}</div><div class="mu">${a?'Accuracy '+a.p+'% ('+a.o+'/'+a.a+')':'No practice yet'}${S.notes[c.id]?', has note':''}</div></div>${w?'<span class="tg">weak</span>':''}</div>`};
function chap(){const f=S.f||'A';
  return`<h2>Chapters</h2><div class="ch">${['A',...SYL.map(s=>s.k)].map(k=>`<button class="${f===k?'on':''}" data-a="flt" data-id="${k}">${k==='A'?'All':SUB[k].n}</button>`).join('')}</div>`+
  SYL.filter(s=>f==='A'||s.k===f).map(s=>`<div class="c"><div class="row"><b style="color:${s.c}" class="sp">${s.n}</b><span class="mu">${pct(dOf(s.k))}% done</span></div>${dOf(s.k).map(row).join('')}</div>`).join('')}

function det(id){const c=CH[id],s=SUB[c.k],a=accCh(id),h=S.acc.filter(r=>r.c===id).slice().reverse();
  return`<button class="b alt" data-a="close">← Back</button><h2 style="color:${s.c};margin-top:14px">${esc(c.n)}</h2><p class="mu">${s.n}, about ${c.h} hours to finish</p>
  <div class="c"><label class="row"><input type="checkbox" data-a="tog" data-id="${id}" ${isDone(id)?'checked':''}><b>Chapter completed</b></label>${isDone(id)?`<p class="mu">Completed ${S.done[id]}${S.rev[id]?', last revised '+S.rev[id]:''}</p><button class="b alt" data-a="revd" data-id="${id}">I revised this today</button>`:''}</div>
  <div class="c"><h3>Practice accuracy</h3>${a?`${bar(a.p,a.p<60?'var(--bad)':'var(--ok)')}<b>${a.p}%</b> <span class="mu">${a.o} correct out of ${a.a}</span>`:'<p class="mu">Add a practice session to see your accuracy.</p>'}
  <form data-f="acc" data-id="${id}"><input type="number" name="a" min="1" placeholder="Attempted" required><input type="number" name="o" min="0" placeholder="Correct" required><button class="b">Save</button></form>
  ${h.map(r=>`<div class="rw"><span class="sp">${r.d}: ${r.o}/${r.a} (${Math.round(r.o/r.a*100)}%)</span><button class="x" data-a="delAcc" data-id="${r.id}">✕</button></div>`).join('')}</div>
  <div class="c"><h3>Notes</h3><textarea data-n="${id}" placeholder="Formulas, doubts, important points...">${esc(S.notes[id]||'')}</textarea></div>`}

function log(){const r=S.timer,h=S.ses.slice().sort((a,b)=>b.at-a.at).slice(0,25),so=SYL.map(s=>`<option value="${s.k}" ${r&&r.s===s.k?'selected':''}>${s.n}</option>`).join('');
  return`<h2>Study log</h2><div class="c"><div class="tm" id="tm">00:00</div><div class="row"><select id="ts" class="sp" ${r?'disabled':''}>${so}</select>${r?'<button class="b" data-a="stop">Stop and save</button>':'<button class="b" data-a="start">Start timer</button>'}</div></div>
  <div class="c"><h3>Add hours manually</h3><form data-f="ses"><select name="s">${so}</select><input type="number" name="m" min="1" placeholder="Minutes" required><input type="date" name="d" value="${today()}"><button class="b">Save</button></form></div>
  <div class="c"><h3>Recent sessions</h3>${h.map(x=>`<div class="rw"><span class="sp"><b style="color:${SUB[x.s].c}">${SUB[x.s].n}</b><br><span class="mu">${x.d}</span></span><b>${fm(x.m)}</b><button class="x" data-a="delSes" data-id="${x.id}">✕</button></div>`).join('')||'<p class="mu">Nothing logged yet.</p>'}</div>`}

function stats(){
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push([ds(d),d.toLocaleDateString('en',{weekday:'short'})])}
  const v=days.map(d=>minOn(d[0])),mx=Math.max(60,...v),tot=v.reduce((a,b)=>a+b,0),w=weakList();
  const tz=n=>String(n).padStart(2,'0');
  return`<h2>Stats</h2><div class="c"><h3>This week</h3><div class="mu">${fm(tot)} studied in the last 7 days</div><div class="wk">${days.map((d,i)=>`<div><small>${v[i]?fm(v[i]):''}</small><i style="height:${v[i]/mx*100}px"></i>${d[1]}</div>`).join('')}</div></div>
  <div class="c"><h3>Accuracy by subject</h3>${SYL.map(s=>{const a=accSub(s.k);return`<div class="row"><b style="color:${s.c}" class="sp">${s.n}</b>${a?`<b>${a.p}%</b>`:'<span class="mu">no data</span>'}</div>${bar(a?a.p:0,s.c)}`}).join('')}</div>
  <div class="c"><h3>Weak chapters</h3>${w.map(x=>`<div class="rw" data-a="open" data-id="${x.c.id}"><span class="sp">${esc(x.c.n)}<br><span class="mu">${SUB[x.c.k].n}</span></span><b class="bad">${x.p}%</b></div>`).join('')||'<p class="mu">None yet. Chapters under 60% accuracy (with 5 or more questions) appear here.</p>'}</div>
  <div class="c"><h3>Mock tests</h3><form data-f="test"><input type="text" name="n" placeholder="Test name"><input type="number" name="sc" min="0" placeholder="Score" required><input type="number" name="t" min="1" placeholder="Out of" required><button class="b">Add</button></form>
  ${S.tests.slice().sort((a,b)=>a.d<b.d?1:-1).slice(0,8).map(t=>`<div class="rw"><span class="sp">${esc(t.n)}<br><span class="mu">${t.d}</span></span><b>${t.sc}/${t.t} (${Math.round(t.sc/t.t*100)}%)</b><button class="x" data-a="delTest" data-id="${t.id}">✕</button></div>`).join('')}</div>
  <div class="c"><h3>Settings</h3><form data-f="prof"><input type="text" name="n" value="${esc(S.name)}" placeholder="Name"><input type="date" name="d" value="${S.exam}"><input type="number" name="g" min="10" value="${S.goal}" placeholder="Daily goal (min)"><button class="b">Save</button></form><p class="mu">Daily goal is in minutes.</p>
  <label class="row"><input type="checkbox" data-a="rmOn" ${S.rm.on?'checked':''}><span class="sp">Daily reminder</span><input type="time" data-a="rmT" value="${tz(S.rm.h)}:${tz(S.rm.m)}"></label><p class="mu" id="rmsg"></p></div>
  <div class="c"><h3>Backup</h3><textarea id="bk" style="min-height:70px;font-size:12px" placeholder="Tap Copy backup, or paste a saved backup here to restore."></textarea><div class="row"><button class="b alt" data-a="exp">Copy backup</button><button class="b alt" data-a="imp">Restore</button></div><p class="mu" id="bkm"></p>
  <button class="b alt" style="margin-top:8px" data-a="rst">Erase all data</button></div>`}

const V={dash,chap,log,stats},NV=[['dash','Dashboard','◉'],['chap','Chapters','☰'],['log','Log','⏱'],['stats','Stats','▤']];
function render(){clearInterval(tick);const a=$('#app');
  if(!S.setup){a.innerHTML=setup();return}
  a.innerHTML=(ov?det(ov):V[tab]())+(ov?'':`<nav>${NV.map(n=>`<button class="${tab===n[0]?'on':''}" data-a="tab" data-id="${n[0]}"><span>${n[2]}</span>${n[1]}</button>`).join('')}</nav>`);
  if(!ov&&tab==='log'){const f=()=>{const e=$('#tm');if(!e)return;const s=S.timer?Math.floor((Date.now()-S.timer.t)/1000):0,h=Math.floor(s/3600);e.textContent=(h?h+':':'')+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};f();tick=setInterval(f,1000)}}

/* ---------- Reminder (daily notification) ---------- */
async function sched(){const LN=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;if(!LN)return'Reminders work in the installed app.';
  try{await LN.cancel({notifications:[{id:1}]});if(!S.rm.on)return'Reminder is off.';const p=await LN.requestPermissions();if(p.display!=='granted')return'Please allow notifications for .hs in phone settings.';
    await LN.schedule({notifications:[{id:1,title:'.hs study time',body:'Time to study. Log today\'s hours!',schedule:{on:{hour:S.rm.h,minute:S.rm.m},allowWhileIdle:true}}]});return'Reminder set for every day.'}catch(e){return'Could not set reminder.'}}

/* ---------- Sample data (for screenshots) ---------- */
function sampleOn(){if(S.sample)return;const b=JSON.stringify(S),d=n=>{const x=new Date();x.setDate(x.getDate()-n);return ds(x)};
  const n=def();n.name=S.name||'Student';n.exam=left(S.exam)>0?S.exam:d(-75);n.setup=true;n.sample=true;n.bak=b;
  ['P1','P2','P3','P4','P5','C1','C2','C3','M1','M2','M3','M4','M5','M6'].forEach((id,i)=>n.done[id]=d(25-i));
  [['P1',20,17],['P2',30,26],['P3',25,16],['P4',40,21],['P5',20,9],['C1',30,26],['C2',25,15],['C3',20,17],['M1',20,19],['M3',30,18],['M5',25,23]].forEach((r,i)=>n.acc.push({id:'a'+i,c:r[0],a:r[1],o:r[2],d:d(i)}));
  [[0,'P',130],[1,'M',95],[2,'C',120],[3,'P',150],[4,'M',100],[5,'C',140],[6,'P',60]].forEach((r,i)=>n.ses.push({id:'s'+i,s:r[1],m:r[2],d:d(r[0]),at:Date.now()-i}));
  [['Unit Test 1',34,50,20],['Weekly Test',41,60,9]].forEach((r,i)=>n.tests.push({id:'t'+i,n:r[0],sc:r[1],t:r[2],d:d(r[3])}));
  S=n}
function sampleOff(){try{S=Object.assign(def(),JSON.parse(S.bak))}catch(e){S=def()}}

/* ---------- Taps and forms ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.matches('input[data-a=rmOn],input[data-a=rmT]'))return;
  const a=b.dataset.a,id=b.dataset.id,y=scrollY;
  if(a==='tab'){tab=id;ov=null}
  else if(a==='flt')S.f=id;
  else if(a==='tog'){if(S.done[id]){delete S.done[id];delete S.rev[id]}else S.done[id]=today()}
  else if(a==='fin'){S.setup=true;tab='dash'}
  else if(a==='open'){ov=id;history.pushState({o:1},'')}
  else if(a==='close'){history.back();return}
  else if(a==='revd')S.rev[id]=today();
  else if(a==='start')S.timer={s:$('#ts').value,t:Date.now()};
  else if(a==='stop'){const m=Math.max(1,Math.round((Date.now()-S.timer.t)/6e4));S.ses.push({id:uid(),s:S.timer.s,m,d:today(),at:Date.now()});S.timer=null}
  else if(a==='delSes')S.ses=S.ses.filter(x=>x.id!==id);
  else if(a==='delAcc')S.acc=S.acc.filter(x=>x.id!==id);
  else if(a==='delTest')S.tests=S.tests.filter(x=>x.id!==id);
  else if(a==='sample')sampleOn();
  else if(a==='unsample')sampleOff();
  else if(a==='exp'){const t=$('#bk');t.value=JSON.stringify(S);t.select();try{navigator.clipboard.writeText(t.value)}catch(x){}$('#bkm').textContent='Backup copied. Paste it in a note and keep it safe.';return}
  else if(a==='imp'){try{const d=JSON.parse($('#bk').value);if(!d||typeof d.done!=='object')throw 0;S=Object.assign(def(),d)}catch(x){$('#bkm').textContent='That is not a valid backup.';return}}
  else if(a==='rst'){if(!rstArm){rstArm=true;b.textContent='Tap again to erase everything';return}S=def();step=0;tab='dash';rstArm=false}
  else return;
  save();render();scrollTo(0,(a==='tab'||a==='open'||a==='fin')?0:y)});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,k=f.dataset.f,d=Object.fromEntries(new FormData(f));
  if(k==='s0'){S.name=d.n.trim();step=1}
  else if(k==='s1'){S.exam=d.d;step=2}
  else if(k==='acc'){const a=+d.a;S.acc.push({id:uid(),c:f.dataset.id,a,o:Math.min(+d.o,a),d:today()})}
  else if(k==='ses')S.ses.push({id:uid(),s:d.s,m:+d.m,d:d.d||today(),at:Date.now()});
  else if(k==='test')S.tests.push({id:uid(),n:d.n.trim()||'Test',sc:+d.sc,t:+d.t,d:today()});
  else if(k==='prof'){S.name=d.n.trim()||S.name;S.exam=d.d||S.exam;S.goal=Math.max(10,+d.g||120)}
  save();render()});
document.addEventListener('change',async e=>{const a=e.target.dataset.a;
  if(a==='rmOn')S.rm.on=e.target.checked;else if(a==='rmT'){const p=e.target.value.split(':');S.rm.h=+p[0];S.rm.m=+p[1]}else return;
  save();const m=await sched(),el=$('#rmsg');if(el)el.textContent=m});
document.addEventListener('input',e=>{const n=e.target.dataset.n;if(n){S.notes[n]=e.target.value;save()}});
addEventListener('popstate',()=>{ov=null;render()});

load();render();if(S.rm.on)sched();
</script></body></html>
